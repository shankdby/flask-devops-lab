# PHASE 1 - Hand-written baseline pipeline (no AI).
name: CI Basic

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest
      - name: Build Docker image
        run: docker build -t flask-devops-lab .
